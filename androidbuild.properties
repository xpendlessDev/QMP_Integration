# Android Build Properties

# Enabling clear text traffic for HTTP URLs (if needed)
android.useCleartextTraffic=true

# Permissions are usually managed through Kony Visualizer settings,
# which then translates to AndroidManifest.xml.
# Example of what Visualizer would ensure is in the manifest:
# <uses-permission android:name="android.permission.INTERNET" />
# <uses-permission android:name="android.permission.CAMERA" />
# <uses-permission android:name="android.permission.RECORD_AUDIO" />
# <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
# <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

# Other Android specific build properties would go here.
# For example:
# target=android-30
# kony.sdk.version=9.2.0
# ...etc.
# These are illustrative and would be set by the Kony environment.

# The following entries are typically added by Visualizer based on project settings
# and are used by the Kony build process.
# For Camera:
# enableCamera=true
# For Location:
# enableLocation=true
# For Microphone (often covered by Camera or other settings, but explicitly):
# enableMicrophone=true (This is a conceptual property name)

# Kony build system automatically includes INTERNET permission.
# For other permissions, ticking boxes in Visualizer under Native App settings
# (Android -> Permissions) adds them to the generated AndroidManifest.xml.
# For example, checking "Camera" adds <uses-permission android:name="android.permission.CAMERA"/>.
# Checking "Access Fine Location" adds <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>.
# Checking "Record Audio" adds <uses-permission android:name="android.permission.RECORD_AUDIO"/>.

# In a real project, these specific permission flags (like enableCamera) might not exist directly
# in this file but are translated from Visualizer settings into the final AndroidManifest.xml.
# The `android.useCleartextTraffic=true` is a valid and often needed property.
# For this exercise, we're noting the intent.
isMVC=false
appid=WebViewApp
prjname=WebViewApp
appver=1.0.0
buildtype=debug
sdkversion=9.2.150
mastersPropertiesVersion=3
androidtargetsdkversion=30
# Above are example values Kony Visualizer might set.
# The key is that Visualizer handles adding <uses-permission> tags to AndroidManifest.xml.
# We'll focus on the runtime request part in JS.
